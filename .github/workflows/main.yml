name: Sample CI
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        continue-on-error: true
        with:
          # enable in case want to run scan on full git commit history
          # base: ""
          # head: HEAD
          extra_args: --config=.github/custom_detectors.yaml --no-verification --results=verified,unknown,unverified --json
      - name: Summary with commit hashes
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "## Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Detector | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          docker run --rm -v "$PWD":/tmp -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///tmp/ --since-commit "" --branch HEAD \
            --config=.github/custom_detectors.yaml --no-verification \
            --results=verified,unknown,unverified --json --no-update 2>/dev/null | \
          jq -r 'select(.SourceMetadata) | "\(.DetectorName) | \(.SourceMetadata.Data.Git.file) | L\(.SourceMetadata.Data.Git.line) | \(.SourceMetadata.Data.Git.commit)"' | sort -u | awk '{printf "| %d | %s |\n", NR, $0}' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Secrets detected - failing build." >> $GITHUB_STEP_SUMMARY
      - name: Fail if secrets found
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1

  test-functions:
    name: Test identity-context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'functions/identity-context/requirements.txt'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: functions/identity-context
      - name: Run tests if test_main.py exists
        run: |
          if [ -f "test_main.py" ]; then
            echo "Running tests with test_main.py"
            pytest
          else
            echo "No test_main.py found, skipping tests"
          fi
        working-directory: functions/identity-context
      - name: Verify function starts
        run: |
          timeout 30s bash -c '
            python main.py > output.log 2>&1 &
            PID=$!
            while ! grep -q "running at port 8081" output.log 2>/dev/null; do
              sleep 1
            done
            echo "✅ Application started successfully!"
            kill $PID 2>/dev/null || true
          ' || {
            echo "❌ Application failed to start"
            cat output.log 2>/dev/null || echo "No output log found!"
            exit 1
          }
        working-directory: functions/identity-context